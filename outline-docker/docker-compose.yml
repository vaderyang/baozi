services:
  outline:
    image: netis/house-outline:1.0.1
    env_file: ./docker.env
    # 不需要再把 3000 暴露给宿主
    expose:
      - "3000"
    volumes:
      - storage-data:/var/lib/outline/data
    depends_on:
      - postgres
      - redis

  https-portal:
    image: steveltn/https-portal
    restart: always
    links:
      - outline
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAINS: "house.netis.com -> http://outline:3000"
      STAGE: "local"          # 本机自签证书。若要真证书，需可公网校验再用 production
      WEBSOCKET: "true"
      CLIENT_MAX_BODY_SIZE: "0"

  redis:
    image: redis:7
    expose: [ "6379" ]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "pass"
      POSTGRES_DB: "outline"
    expose: [ "5432" ]
    volumes:
      - database-data:/var/lib/postgresql/data

volumes:
  storage-data:
  database-data:

