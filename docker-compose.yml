services:
  postgres:
    image: postgres:16-alpine
    container_name: outline-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outline_password}
      POSTGRES_DB: ${POSTGRES_DB:-outline}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outline}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - outline-network

  redis:
    image: redis:7-alpine
    container_name: outline-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - outline-network

  outline:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PATH: /opt/outline
        CDN_URL: ${CDN_URL:-}
    container_name: outline-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-6700}:6700"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-outline}:${POSTGRES_PASSWORD:-outline_password}@postgres:5432/${POSTGRES_DB:-outline}
      REDIS_URL: redis://redis:6379
      URL: ${URL:-http://localhost:6700}
      PORT: ${PORT:-6700}
      SECRET_KEY: ${SECRET_KEY}
      UTILS_SECRET: ${UTILS_SECRET}
      FILE_STORAGE: ${FILE_STORAGE:-local}
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
    volumes:
      - outline-data:/var/lib/outline/data
    networks:
      - outline-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  outline-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  outline-data:
    driver: local
