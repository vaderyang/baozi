services:
  outline:
    image: netis/house-outline:1.0.1
    env_file: ./docker.env
    ports:
      - "8080:3000" # 可选：做 http->https 重定向或排障
    environment:
      - PORT=3000 # Outline 默认应用端口
      - FORCE_HTTPS=false # 关闭强制 https
    depends_on:
      - postgres
      - redis

  redis:
    image: redis:7
    expose: [ "6379" ]

  postgres:
    image: postgres:16
    env_file: ./docker.env
    expose: [ "5432" ]
    volumes:
      - database-data:/var/lib/postgresql/data

volumes:
  storage-data:
  database-data:


